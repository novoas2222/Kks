name: Respin Original wattOS R13 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  respin-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            wget

      - name: Download Original wattOS R13 ISO
        run: |
          mkdir -p iso_work
          cd iso_work
          # Download directly from official mirror
          wget -O original_wattos.iso "https://extantpc.com/iso/wattOS-R13.iso"

      - name: Extract ISO and SquashFS
        run: |
          cd iso_work
          mkdir -p iso_extracted squashfs_root
          
          # Extract ISO contents
          osirrox -indev original_wattos.iso -extract / iso_extracted
          
          # Locate and unpack filesystem.squashfs
          SQUASH_PATH=$(find iso_extracted -name "filesystem.squashfs")
          sudo unsquashfs -d squashfs_root "$SQUASH_PATH"

      - name: Chroot and Purge Unwanted Packages
        run: |
          cd iso_work
          
          # Bind system mounts for chroot session
          sudo mount --bind /dev squashfs_root/dev
          sudo mount --bind /run squashfs_root/run
          sudo mount -t proc proc squashfs_root/proc
          sudo mount -t sysfs sysfs squashfs_root/sys

          # Copy DNS configuration into chroot for network operations
          sudo cp /etc/resolv.conf squashfs_root/etc/resolv.conf

          # Perform package purge inside the chroot environment
          sudo chroot squashfs_root /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update

            # Purge specified apps, document viewers, screensavers, and unused firmware
            apt-get purge -y \
              gthumb \
              imagemagick \
              imagemagick-6-common \
              xscreensaver \
              xscreensaver-data \
              xscreensaver-gl \
              atril \
              evince \
              xreader \
              mpdf \
              lm-sensors \
              sensord \
              firmware-amd-graphics \
              firmware-nvidia-tesla-gsp \
              amd64-microcode \
              firmware-ast \
              dahdi-firmware-nonfree \
              firmware-myricom \
              firmware-netxen \
              firmware-qlogic \
              firmware-cavium

            # Disable unused background daemons if present
            systemctl disable ModemManager.service 2>/dev/null || true
            systemctl disable avahi-daemon.service 2>/dev/null || true

            # Remove residual configurations and clear apt cache
            apt-get autoremove --purge -y
            apt-get clean
            rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          "

          # Clean up mounts
          sudo umount -lf squashfs_root/dev
          sudo umount -lf squashfs_root/run
          sudo umount -lf squashfs_root/proc
          sudo umount -lf squashfs_root/sys

      - name: Rebuild SquashFS
        run: |
          cd iso_work
          SQUASH_PATH=$(find iso_extracted -name "filesystem.squashfs")
          
          # Replace old squashfs with newly modified system image
          sudo rm -f "$SQUASH_PATH"
          sudo mksquashfs squashfs_root "$SQUASH_PATH" -b 1048576 -comp xz -Xbcj x86

      - name: Update MD5 Checksums
        run: |
          cd iso_work/iso_extracted
          if [ -f md5sum.txt ]; then
            sudo bash -c 'md5sum $(find . -type f ! -name "md5sum.txt") > md5sum.txt'
          fi

      - name: Repack Bootable ISO Image
        run: |
          cd iso_work
          xorriso -as mkisofs \
            -r -V "wattOS-R13-Custom" \
            -J -joliet-long \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -o ../wattOS-R13-Custom-amd64.iso \
            iso_extracted

      - name: Upload Custom ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wattOS-R13-Custom-ISO
          path: wattOS-R13-Custom-amd64.iso
          retention-days: 7
